name: Weekly comic metadata preview
on:
  schedule:
    - cron: '35 20 * * 3'
    - cron: '35 21 * * 3'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: weekly-pull-list-metadata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Refresh catalog and preview without email or delivery marking
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/weekly.js --dry-run
